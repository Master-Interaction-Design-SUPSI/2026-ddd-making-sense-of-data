name: Reviewed course recovery

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Use the reviewed main-controlled rollback/resume plan while ordinary publishing is paused'
        type: choice
        options: [capture, rollback, resume]
        default: capture

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main' && vars.DDD_PUBLICATION_PAUSED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      deployments: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DDD_PUBLICATION_PAUSED: ${{ vars.DDD_PUBLICATION_PAUSED }}
      OPERATION: ${{ inputs.operation }}
      RECOVERY_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin trusted recovery code
        run: |
          python3 - <<'PY'
          import os
          if os.environ['OPERATION'] not in {'capture', 'rollback', 'resume'}:
              raise ValueError('Unsupported reviewed recovery operation')
          PY
          echo "MAIN_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify recovery and publication contracts
        env:
          DDD_PUBLICATION_PAUSED: 'false'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify browser contracts
        run: node --test scripts/test_annotations.js scripts/test_playback.js scripts/test_editor.js
      - id: pages
        uses: actions/configure-pages@v5
      - name: Validate immutable capture locator and reviewed release
        if: inputs.operation != 'resume'
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from publication_rollback import validate_reviewed_plan
          from publication_state import unique_keys
          def read(name):
              path = Path('.github') / name
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 16384:
                  raise ValueError('Missing or oversized reviewed recovery configuration')
              return json.loads(path.read_bytes(), object_pairs_hook=unique_keys)
          plan = validate_reviewed_plan(read('archive-rollback.json'))
          source = read('archive-rollback-source.json')
          if not isinstance(source, dict) or set(source) != {'version', 'kind', 'run_id', 'run_attempt'}:
              raise ValueError('Invalid immutable capture locator')
          if type(source['version']) is not int or source['version'] != 1 or source['kind'] not in {'pages', 'capture'}:
              raise ValueError('Invalid recovery artifact kind')
          for key in ('run_id', 'run_attempt'):
              if not isinstance(source[key], str) or not re.fullmatch(r'[1-9][0-9]*', source[key]):
                  raise ValueError('Recovery artifact requires exact producing run and attempt')
          if source['kind'] == 'pages' and any(source[key] != plan['expected_v1_release'][key] for key in ('run_id', 'run_attempt')):
              raise ValueError('Original Pages artifact must name the reviewed V1 release run')
          prefix = 'course-pages' if source['kind'] == 'pages' else 'v1-recovery'
          name = f"{prefix}-{source['run_id']}-{source['run_attempt']}"
          Path('.scratch').mkdir(exist_ok=True)
          Path('.scratch/expected-v1-release.json').write_text(json.dumps(plan['expected_v1_release']))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"artifact_name={name}\nrun_id={source['run_id']}\nkind={source['kind']}\n")
          PY
      - name: Download exact same-repository recovery artifact
        if: inputs.operation != 'resume'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          run-id: ${{ steps.source.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: .scratch/recovery-input
      - name: Verify and preserve original V1 capture
        if: inputs.operation != 'resume'
        env:
          CAPTURE_KIND: ${{ steps.source.outputs.kind }}
        run: |
          if [ "$CAPTURE_KIND" = pages ]; then
            python3 scripts/publication_recovery.py capture-v1-artifact --artifact .scratch/recovery-input/artifact.tar --release .scratch/expected-v1-release.json --out .scratch/recovery-capture
          else
            python3 scripts/publication_recovery.py verify-capture --capture .scratch/recovery-input --expected-release .scratch/expected-v1-release.json
            mv .scratch/recovery-input .scratch/recovery-capture
          fi
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          plan = json.loads(Path('.github/archive-rollback.json').read_bytes())
          actual = hashlib.sha256(Path('.scratch/recovery-capture/capture.json').read_bytes()).hexdigest()
          if actual != plan['capture_sha256']:
              raise ValueError('Capture digest differs from the reviewed rollback plan')
          PY
      - name: Retain verified recovery bundle
        if: inputs.operation != 'resume'
        uses: actions/upload-artifact@v4
        with:
          name: v1-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scratch/recovery-capture
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Prepare the reviewed rollback or durable V2 resumption
        if: inputs.operation != 'capture'
        id: prepare_recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ "$OPERATION" = rollback ]; then
            python3 scripts/publication_rollback.py prepare --state .scratch/recovery-state.json --capture .scratch/recovery-capture --reviewed-plan .github/archive-rollback.json --stage .scratch/recovery-stage
          else
            python3 scripts/publication_rollback.py resume-prepare --state .scratch/recovery-state.json --reviewed-plan .github/archive-resume.json --stage .scratch/recovery-stage
          fi
      - name: Upload exact prepared recovery site
        if: inputs.operation != 'capture' && steps.prepare_recovery.outputs.resume_complete != 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          name: recovery-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scratch/recovery-stage/site
          retention-days: 7
      - name: Record and authorize the reviewed mutation
        if: inputs.operation != 'capture' && steps.prepare_recovery.outputs.resume_complete != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$OPERATION" = rollback ]; then
            python3 scripts/publication_rollback.py record --state .scratch/recovery-state.json --run-url "$RECOVERY_RUN_URL"
            python3 scripts/publication_rollback.py authorize --state .scratch/recovery-state.json
          else
            python3 scripts/publication_rollback.py resume-record --state .scratch/recovery-state.json --run-url "$RECOVERY_RUN_URL"
            python3 scripts/publication_rollback.py resume-authorize --state .scratch/recovery-state.json
          fi
      - id: deployment
        if: inputs.operation != 'capture' && steps.prepare_recovery.outputs.resume_complete != 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: recovery-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify served bytes and preserved archive authority
        if: inputs.operation != 'capture' && steps.prepare_recovery.outputs.resume_complete != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$OPERATION" = rollback ]; then
            python3 scripts/publication_rollback.py verify --state .scratch/recovery-state.json --run-url "$RECOVERY_RUN_URL"
          else
            python3 scripts/publication_rollback.py resume-verify --state .scratch/recovery-state.json --run-url "$RECOVERY_RUN_URL"
          fi
