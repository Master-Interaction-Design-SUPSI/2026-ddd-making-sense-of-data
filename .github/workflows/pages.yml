name: Publish course website

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

env:
  DDD_PUBLICATION_PAUSED: ${{ vars.DDD_PUBLICATION_PAUSED }}

# A publication run uses queue `pages`; an issue that is not an eligible publication request gets its own queue.
concurrency:
  group: >-
    ${{ (github.event_name != 'issues'
         || vars.DDD_REQUESTS_ENABLED == 'true' && contains(github.event.issue.labels.*.name, 'publication-request'))
        && 'pages' || format('ignored-issue-{0}', github.event.issue.number) }}
  cancel-in-progress: false

# Each job seals its result as an artifact and outputs `state` (`<artifact>:<metadata sha256>`).
# The next job reads it as INPUT_STATE, downloads that artifact and admits it only with that digest.
jobs:
  pin:
    # Not paused, on main, and either not an issue or an eligible publication request.
    if: >-
      vars.DDD_PUBLICATION_PAUSED != 'true' && github.ref == 'refs/heads/main'
      && (github.event_name != 'issues'
          || vars.DDD_REQUESTS_ENABLED == 'true' && contains(github.event.issue.labels.*.name, 'publication-request'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      main_commit: ${{ steps.pin.outputs.main_commit }}
      pages_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - id: pin
        name: Pin latest trusted main at execution
        run: echo "main_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: pages
        uses: actions/configure-pages@v5

  admit:
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      deployments: write
    env:
      MAIN_COMMIT: ${{ needs.pin.outputs.main_commit }}
      REQUESTS_ENABLED: ${{ vars.DDD_REQUESTS_ENABLED == 'true' }}
    outputs:
      state: ${{ steps.admit.outputs.state }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pin.outputs.main_commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: admit
        name: Capture request cutoff and reserve eligible refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py admit
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.admit.outputs.artifact }}
          path: .scratch/job-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  prepare:
    needs: [pin, admit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: read
    env:
      MAIN_COMMIT: ${{ needs.pin.outputs.main_commit }}
      PAGES_URL: ${{ needs.pin.outputs.pages_url }}
      INPUT_STATE: ${{ needs.admit.outputs.state }}
    outputs:
      state: ${{ steps.prepare.outputs.state }}
      archive: ${{ steps.prepare.outputs.archive }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pin.outputs.main_commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify trusted publishing code
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify browser contracts and renderer lifecycle
        run: node --test scripts/test_annotations.js scripts/test_playback.js scripts/test_editor.js
      - id: input
        run: echo "artifact=${INPUT_STATE%%:*}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.input.outputs.artifact }}
          path: .scratch/job-input
      - id: prepare
        name: Prepare candidate or pending pair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare.outputs.artifact }}
          path: .scratch/job-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  accept:
    needs: [pin, prepare]
    # Only a prepared candidate is written to student-work.
    if: needs.prepare.outputs.archive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      deployments: read
    env:
      MAIN_COMMIT: ${{ needs.pin.outputs.main_commit }}
      INPUT_STATE: ${{ needs.prepare.outputs.state }}
    outputs:
      state: ${{ steps.accept.outputs.state }}
      archive_commit: ${{ steps.accept.outputs.archive_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pin.outputs.main_commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: input
        run: echo "artifact=${INPUT_STATE%%:*}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.input.outputs.artifact }}
          path: .scratch/job-input
      - id: accept
        name: Revalidate policy and accept by expected-parent fast-forward
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py accept
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.accept.outputs.artifact }}
          path: .scratch/job-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [pin, prepare, accept]
    # Runs unless an earlier job failed: after accept, or straight after prepare when there is no candidate.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      MAIN_COMMIT: ${{ needs.pin.outputs.main_commit }}
      PAGES_URL: ${{ needs.pin.outputs.pages_url }}
      INPUT_STATE: ${{ needs.accept.outputs.state || needs.prepare.outputs.state }}
    outputs:
      state: ${{ steps.finalize.outputs.state }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pin.outputs.main_commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: input
        run: echo "artifact=${INPUT_STATE%%:*}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.input.outputs.artifact }}
          path: .scratch/job-input
      - id: build
        name: Build accepted pair or reconstruct exact pending release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py build
      - uses: actions/upload-pages-artifact@v4
        if: steps.build.outputs.deploy == 'true'
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
          retention-days: 7
      - id: record
        if: steps.build.outputs.deploy == 'true'
        name: Record attempted release separately from verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py record
      - id: authorize
        if: steps.record.outputs.deploy == 'true'
        name: Recheck main and deployment identity before Pages mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py authorize
      - id: deployment
        if: steps.authorize.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify served release and content probes
        if: steps.authorize.outputs.deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py verify
      - id: finalize
        if: always()
        name: Export bounded truthful result for the answer job
        run: python3 scripts/publish.py finalize
      - uses: actions/upload-artifact@v4
        if: always() && steps.finalize.outputs.artifact != ''
        with:
          name: ${{ steps.finalize.outputs.artifact }}
          path: .scratch/job-output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Summarize group results for maintainers
        if: always()
        run: python3 scripts/publish.py summary

  answer:
    needs: [pin, admit, prepare, accept, publish]
    # Requests are on and admission ran: answer from the newest state any later job sealed.
    if: ${{ !cancelled() && needs.admit.result == 'success' && vars.DDD_REQUESTS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      MAIN_COMMIT: ${{ needs.pin.outputs.main_commit }}
      PAGES_URL: ${{ needs.pin.outputs.pages_url }}
      INPUT_STATE: >-
        ${{ needs.publish.outputs.state || needs.accept.outputs.state
            || needs.prepare.outputs.state || needs.admit.outputs.state }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.pin.outputs.main_commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: input
        run: echo "artifact=${INPUT_STATE%%:*}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.input.outputs.artifact }}
          path: .scratch/job-input
      - name: Repair one bot-owned status comment and close only verified checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py answer
